<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- 背景圆 -->
  <rect x="10" y="10" width="180" height="180" rx="40" fill="url(#grad)" opacity="0.1"/>

  <!-- 树结构图标 -->
  <!-- 根节点 -->
  <circle cx="100" cy="50" r="18" fill="url(#grad)" stroke="white" stroke-width="3"/>
  <text x="100" y="55" text-anchor="middle" font-size="16" font-weight="bold" fill="white">DS</text>

  <!-- 左子节点 -->
  <line x1="100" y1="68" x2="55" y2="115" stroke="#3b82f6" stroke-width="2.5"/>
  <circle cx="55" cy="130" r="15" fill="#3b82f6" stroke="white" stroke-width="2.5"/>
  <text x="55" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="white">JS</text>

  <!-- 右子节点 -->
  <line x1="100" y1="68" x2="145" y2="115" stroke="#8b5cf6" stroke-width="2.5"/>
  <circle cx="145" cy="130" r="15" fill="#8b5cf6" stroke="white" stroke-width="2.5"/>
  <text x="145" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="white">⚡</text>

  <!-- 底部节点 -->
  <line x1="55" y1="145" x2="40" y2="165" stroke="#3b82f6" stroke-width="2"/>
  <line x1="55" y1="145" x2="70" y2="165" stroke="#3b82f6" stroke-width="2"/>
  <line x1="145" y1="145" x2="130" y2="165" stroke="#8b5cf6" stroke-width="2"/>
  <line x1="145" y1="145" x2="160" y2="165" stroke="#8b5cf6" stroke-width="2"/>

  <circle cx="40" cy="178" r="10" fill="#60a5fa" opacity="0.7"/>
  <circle cx="70" cy="178" r="10" fill="#60a5fa" opacity="0.7"/>
  <circle cx="130" cy="178" r="10" fill="#a78bfa" opacity="0.7"/>
  <circle cx="160" cy="178" r="10" fill="#a78bfa" opacity="0.7"/>
</svg>
