# Dependabot 自动依赖更新配置
version: 2
updates:
  # npm 生态（也适用于 pnpm lock 文件）
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # 忽略被上游锁定的依赖
    ignore:
      # vitepress@1.x 锁定 vite@5.x，无法升级到 vite@6
      - dependency-name: "vite"
        versions: [">=6.0.0"]
      # vitest@4 需要 vite@6+，与 vitepress@1 不兼容
      - dependency-name: "vitest"
        versions: [">=4.0.0"]
